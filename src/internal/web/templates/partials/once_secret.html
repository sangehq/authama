{{define "once_secret"}}
<div class="alert alert-warning" role="alert" id="once-secret" aria-live="polite">
  <h2 class="alert-title h4">{{icon "key"}}<span class="ms-1">The {{.What}} for {{.Name}}, shown once</span></h2>
  <p class="mb-2">Copy it now. authama will not show it again: leave or reload this page and it is gone. Keep it where the program that uses it reads secrets, never in a repository or a chat.</p>
  <div class="input-group">
    <input class="form-control font-monospace" type="text" id="once-secret-value" value="{{.Secret}}" readonly autocomplete="off" spellcheck="false" aria-label="The {{.What}}">
    <button type="button" class="btn btn-primary" data-copy="{{.Secret}}"{{desc "once-secret-copy"}}>{{icon "copy"}}<span class="ms-1">Copy</span></button>
  </div>
</div>
{{end}}
