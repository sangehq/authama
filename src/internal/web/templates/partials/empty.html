{{/* Tabler's empty state, for a list with nothing in it yet. Built with
     `empty "icon" "Title" "What to do about it"`. A backticked span in the
     text is set as code. */}}
{{define "empty"}}<div class="empty py-4">
  <div class="empty-icon">{{icon .Icon}}</div>
  <p class="empty-title">{{.Title}}</p>
  {{if .Text}}<p class="empty-subtitle text-secondary">{{.Subtitle}}</p>{{end}}
</div>{{end}}
