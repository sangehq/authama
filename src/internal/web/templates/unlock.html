{{define "content"}}{{with .Data}}
<div class="container-tight py-4">
  <div class="card card-md">
    <div class="card-body">
      <h1 class="h2 text-center mb-2">{{icon "lock"}}<span class="ms-1">Unlock authama</span></h1>
      <p class="text-secondary text-center">This home is bound to its owner. Enter your PIN to go on.</p>
      {{if .Problem}}<div class="alert alert-danger" role="alert">{{.Problem}}</div>{{end}}
      <form method="post" action="{{basePath}}/unlock" autocomplete="off">
        <input type="hidden" name="csrf" value="{{$.CSRF}}">
        <input type="hidden" name="next" value="{{.Next}}">
        <div class="mb-3">
          <label class="form-label" for="unlock-pin">PIN</label>
          <input class="form-control" type="password" id="unlock-pin" name="pin" required autofocus autocomplete="current-password" minlength="6" maxlength="128">
          <small class="form-hint">Forgot it? Run <code>authama owner pin reset</code> in a terminal on this machine.</small>
        </div>
        <button type="submit" class="btn btn-primary w-100">Unlock</button>
      </form>
    </div>
  </div>
</div>
{{end}}{{end}}
