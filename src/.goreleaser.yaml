version: 2
project_name: authama

# This config lives in src/ with the module, but GoReleaser is invoked from the
# repo root (`goreleaser --config src/.goreleaser.yaml`), so every path here is
# repo-relative and only the Go build is pointed into the module, via builds[].dir
# below. Running it the other way round does not work: archive `files:` globbing
# rejects a `..` prefix outright, so LICENSE/README/CHANGELOG become unreachable
# from inside src/.
#
# build/ holds one folder per OS and nothing else (see the Makefile), so
# GoReleaser's working output - per-target folders, artifacts.json,
# metadata.json - goes to .goreleaser-dist/ at the root (gitignored). The
# release assets it uploads are flat, as before.
dist: .goreleaser-dist

before:
  hooks:
    - go -C src mod tidy

# One pure-Go binary cross-compiled to the full OS/arch matrix: authama
# (Authentication Access Manager). The sshmgr alias older releases shipped
# beside it is gone; their bare sshmgr_* assets stay on those releases. CGO is disabled
# so every target is a static, portable binary; -trimpath makes builds
# reproducible and -s -w strips debug info for smaller artifacts.
builds:
  - id: authama
    # The module root. GoReleaser runs from the repo root, so this is the one
    # place that has to know the Go code lives under src/.
    dir: src
    main: ./cmd/authama
    binary: authama
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64 # 64-bit x86
      - arm64 # 64-bit ARM (Apple silicon, Graviton, RPi 64-bit)
      - arm # 32-bit ARM (RPi, etc.)
      - "386" # 32-bit x86
    goarm:
      - "6"
      - "7"
    ignore:
      # macOS ships only amd64 + arm64.
      - { goos: darwin, goarch: arm }
      - { goos: darwin, goarch: "386" }
      # 32-bit ARM is uncommon / unsupported on Windows.
      - { goos: windows, goarch: arm }
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/simtabi/authama/src/internal/version.Version={{ .Version }}
      - -X github.com/simtabi/authama/src/internal/version.Commit={{ .Commit }}
      - -X github.com/simtabi/authama/src/internal/version.Date={{ .CommitDate }}

# A single macOS universal binary (amd64 + arm64) alongside the per-arch ones.
universal_binaries:
  - id: authama
    ids: [authama]
    name_template: authama
    replace: false

# All artifacts use one flat, versionless, Go-style naming scheme:
#   authama_<os>_<arch>[.ext]  with darwin → macos, e.g.
#   authama_macos_arm64, authama_linux_amd64, authama_windows_386.exe,
#   authama_macos_universal, authama_linux_armv7.
# The tar.gz/zip archives and the Linux packages carry the same name (they were
# sshmgr_ up to 0.1.1). The release tag carries the version; the install
# scripts reconstruct these names.
archives:
  - id: binary
    ids: [authama]
    formats: [binary]
    name_template: &name >-
      authama_{{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "all" }}universal{{ else if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}

  - id: archive
    ids: [authama]
    name_template: *name
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # The web UI embeds Tabler, Bootstrap and Popper; their MIT notices ship
      # with the binary that carries them.
      - third-party-notices.md

# Native Linux packages (nfpm operates on the Linux builds only).
nfpms:
  - id: authama
    ids: [authama]
    package_name: authama
    # The package was named sshmgr up to 0.1.1. Installing authama replaces it
    # (deb Replaces/Conflicts, rpm Obsoletes), so an old sshmgr package is
    # removed rather than left beside it. authama no longer provides sshmgr.
    replaces: [sshmgr]
    conflicts: [sshmgr]
    vendor: Simtabi LLC
    homepage: "https://github.com/simtabi/authama"
    maintainer: "Imani Manyara <imani@simtabi.com>"
    description: "Authentication Access Manager: SSH keys and config, and auth tokens for Composer, npm, Docker, git and netrc."
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    file_name_template: 'authama_linux_{{ if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}'

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Reproducible source tarball, uploaded as a first-class release asset next to
# GitHub's auto-generated "Source code" links, so every release ships the exact
# code as well as the binaries.
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# One SBOM per archive (syft, SPDX-JSON), attached as release assets so
# consumers can audit the supply chain of what they download.
sboms:
  - id: archive
    artifacts: archive

# The GitHub release is the only channel (simtabi/.github go-release.yml refuses a config that
# publishes anywhere else). The Homebrew cask, Scoop manifest and Winget manifest this file used
# to carry were removed on 2026-11-13; simtabi/homebrew-tap and simtabi/scoop-bucket are frozen.
release:
  github:
    owner: simtabi
    name: authama
  draft: false
  prerelease: auto
  # The install scripts ship with the release, so `curl | bash` has a URL on the
  # same host as the binaries it downloads, versioned with them, and reachable
  # through the stable releases/latest/download/ redirect. The documented URL
  # pointed at a vanity path that was never published and returned 404 - the
  # primary install command in the README could not fetch the script at all.
  extra_files:
    - glob: src/scripts/install.sh
    - glob: src/scripts/install.ps1

changelog:
  # Do not set disable: true. GoReleaser reads --release-notes inside its
  # changelog pipe, so disabling the pipe dropped the notes and v3.2.0 and
  # v3.4.0 published empty bodies. With --release-notes given, GoReleaser uses
  # that file (the tagged CHANGELOG.md section) and generates nothing itself.
  use: git
