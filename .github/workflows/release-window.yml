# The release-train freeze (DEC-044): from Friday 18:00 to Tuesday 12:30 America/New_York only pull
# requests labelled release-fix, or the train's own release/train-* pull request, may merge. On
# Tuesday at 12:47, after the freeze lifts, the reopen job re-runs the check on every open pull
# request it failed. This repository is on the train (simtabi/.github release-train/train.json); see
# that repository's release-train/README.md.
name: Release window

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "47 12 * * 2"
      timezone: America/New_York

permissions: {}

concurrency:
  group: release-window-${{ github.event.pull_request.number || 'reopen' }}
  cancel-in-progress: true

jobs:
  window:
    if: github.event_name == 'pull_request'
    uses: simtabi/.github/.github/workflows/release-window.yml@f654932e261752737eb3d3eb941c97f59bcff1bd # v0.1.3
  reopen:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
      pull-requests: read
    uses: simtabi/.github/.github/workflows/release-window.yml@f654932e261752737eb3d3eb941c97f59bcff1bd # v0.1.3
    with:
      mode: reopen
