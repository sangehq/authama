# Release: build authama's binaries and publish them on its GitHub release, and nowhere else
# (no Go module proxy path, Homebrew, Scoop, Winget or image). simtabi/.github's reusable
# go-release.yml does the work: it checks the tag, refuses a GoReleaser config that publishes
# anywhere else, takes the notes from the tag's CHANGELOG section and reads them back, mirrors the
# src/vX.Y.Z module tag, runs GoReleaser with src/.goreleaser.yaml, and attests build provenance.
# This file only says when.
#
#   git push origin v0.1.0                                          builds and publishes v0.1.0
#   gh workflow run release.yml --repo sangehq/authama -f tag=v0.1.0  the same, for a tag already pushed
#
# Push a version tag only for final code: tags are final, and a pushed tag publishes.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing vX.Y.Z tag to build and publish'
        required: true
        type: string

permissions: {}

# One run per tag, never cancelled: two runs must not publish the same release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: simtabi/.github/.github/workflows/go-release.yml@d648d8998f95a351001979f9c4527badca588bf1 # simtabi/.github main, with #28 (environment) to #30
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      # The job runs under this repository's release environment, so each release is recorded as a
      # deployment and a required reviewer can be added there without touching this file.
      environment: release
